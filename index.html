
<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RULL STORE</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#050000,#2b0000,#600000,#000000);
overflow:hidden;
color:white;
}

.bg{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:
radial-gradient(circle at 20% 20%,rgba(255,0,0,.35),transparent 40%),
radial-gradient(circle at 80% 80%,rgba(100,0,0,.45),transparent 40%),
radial-gradient(circle at 50% 50%,rgba(0,0,0,.65),transparent 60%);
animation:bg 8s infinite alternate;
z-index:-1;
}

@keyframes bg{
0%{transform:scale(1);}
100%{transform:scale(1.2);}
}

.box{
text-align:center;
}

.logo{
font-size:80px;
margin-bottom:20px;
animation:float 2s infinite;
}

@keyframes float{
0%,100%{transform:translateY(0);}
50%{transform:translateY(-10px);}
}

h1{
font-size:30px;
line-height:1.5;
text-shadow:0 0 20px red;
}

span{
color:#ff3030;
}

button{
margin-top:35px;
padding:16px 60px;
font-size:22px;
border:none;
border-radius:50px;
background:#d40000;
color:white;
cursor:pointer;
box-shadow:0 0 25px red;
transition:.3s;
}

button:hover{
transform:scale(1.05);
}
</style>

</head>
<body>

<div class="bg"></div>

<div class="box">

<div class="logo">🎮</div>

<h1>
WELCOME TO<br>
<span>WEBSITE TOPUP</span><br>
GAME BY <span>RULLSTORE</span>
</h1>

<button onclick="window.location.href='topup.html'">
▶ MASUK
</button>

</div>

</body>
</html>
