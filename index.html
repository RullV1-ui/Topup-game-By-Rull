<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TOPUP BY RULL</title>

<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
<h1>TOPUP BY RULL</h1>
<p>Fast • Safe • Murah</p>
</header>

<div class="container">

<div class="card">
<h2>🎮 Pilih Game</h2>

<select id="game">
<option>Free Fire</option>
<option>Mobile Legends</option>
<option>PUBG Mobile</option>
<option>eFootball</option>
</select>
</div>

<div class="card">
<h2>👤 Masukkan ID</h2>

<input type="text" placeholder="UID / User ID">
</div>

<div class="card">
<h2>💎 Pilih Topup</h2>

<select id="diamond">
<option>5 Diamond</option>
<option>12 Diamond</option>
<option>50 Diamond</option>
<option>70 Diamond</option>
<option>140 Diamond</option>
<option>355 Diamond</option>
<option>720 Diamond</option>
</select>
</div>

<div class="card">
<h2>💳 Pembayaran</h2>

<select>
<option>DuitNow QR</option>
<option>Touch 'n Go</option>
<option>Boost</option>
<option>Bank Transfer</option>
</select>
</div>

<button onclick="buy()">BELI SEKARANG</button>

</div>

<script src="script.js"></script>

</body>
</html>
